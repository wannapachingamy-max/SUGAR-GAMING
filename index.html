<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUGAR GAMING | บริการเติมเกมออนไลน์</title>
    
    <!-- Fonts: Kanit for friendly Thai typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind Config for My Melody Theme (Soft Pink & Chocolate Brown) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        sugar: {
                            50: '#FFF0F5',   // Very pale pink background
                            100: '#FFE4EE',  // Soft pink highlight
                            200: '#FFD1E3',  // Melody light pink
                            300: '#FFB7D5',  // Main pastel pink
                            400: '#FF9EBB',  // Slightly deeper pink
                            500: '#FF85A2',  // Button pink
                            600: '#E66A8A',  // Hover pink
                            700: '#8B5A33',  // Light chocolate brown
                            800: '#5C3A21',  // Dark chocolate brown (Main Text)
                            900: '#382212',  // Deepest brown
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for background animations and visual effects -->
    <style>
        body {
            /* Soft pastel My Melody background gradient */
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4EE 50%, #FFD1E0 100%);
            color: #5C3A21; /* Default text color set to chocolate brown */
            background-attachment: fixed;
        }
        
        h1, h2, h3, h4, h5, h6 {
            color: #5C3A21; /* Ensure headings are brown */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFE4EE;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB7D5;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF85A2;
        }
        .modal-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.7) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(20deg); opacity: 0; }
        }
        @keyframes drift {
            0% { transform: translateX(-15vw); }
            100% { transform: translateX(115vw); }
        }
        @keyframes waveFlow {
            0% { transform: translateX(0) translateZ(0) scaleY(1); }
            50% { transform: translateX(-25%) translateZ(0) scaleY(1.1); }
            100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
        }
        .bg-heart {
            position: fixed;
            color: white;
            animation: floatUp linear infinite;
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(255, 133, 162, 0.3));
        }
        .bg-cloud {
            position: fixed;
            color: rgba(255, 255, 255, 0.95);
            animation: drift linear infinite;
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 4px 10px rgba(255, 183, 213, 0.4));
        }
        .bg-wave-stream {
            position: fixed;
            bottom: -20px;
            left: 0;
            width: 200%;
            height: 250px;
            background: linear-gradient(180deg, rgba(255, 183, 213, 0) 0%, rgba(255, 183, 213, 0.25) 100%);
            border-radius: 40% 40% 0 0 / 60% 60% 0 0;
            animation: waveFlow 18s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes heroCloudDrift {
            0% { left: -20%; }
            100% { left: 120%; }
        }
        
        .hero-cloud {
            position: absolute;
            animation: heroCloudDrift linear infinite;
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(255, 183, 213, 0.3));
            color: rgba(255, 255, 255, 0.95);
        }

        .cute-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border: 2px solid #FFF0F5;
            border-radius: 24px;
            box-shadow: 0 4px 15px rgba(255, 183, 213, 0.2);
            transition: all 0.3s ease;
        }
        .cute-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 133, 162, 0.3);
            border-color: #FFB7D5;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden text-sugar-800">

    <div id="animated-bg" class="fixed inset-0 z-0 pointer-events-none" aria-hidden="true">
        <!-- Soft Pink Glowing Waves in Background -->
        <div class="bg-wave-stream"></div>
        <div class="bg-wave-stream" style="bottom: -50px; opacity: 0.7; animation-duration: 25s; animation-direction: reverse;"></div>

        <!-- Clouds -->
        <div class="bg-cloud top-[10%] opacity-80" style="animation-duration: 45s; font-size: 5rem;">☁️</div>
        <div class="bg-cloud top-[35%] opacity-60" style="animation-duration: 60s; animation-delay: -25s; font-size: 4rem;">☁️</div>
        <div class="bg-cloud top-[65%] opacity-90" style="animation-duration: 50s; animation-delay: -10s; font-size: 6rem;">☁️</div>
        <div class="bg-cloud top-[85%] opacity-50" style="animation-duration: 70s; animation-delay: -40s; font-size: 3.5rem;">☁️</div>
        
        <!-- Hearts -->
        <div class="bg-heart left-[10%]" style="animation-duration: 15s; animation-delay: 0s; font-size: 2rem;">🤍</div>
        <div class="bg-heart left-[25%]" style="animation-duration: 19s; animation-delay: -5s; font-size: 1.5rem; color:#FFB7D5;">🩷</div>
        <div class="bg-heart left-[45%]" style="animation-duration: 14s; animation-delay: -10s; font-size: 2.5rem;">🤍</div>
        <div class="bg-heart left-[65%]" style="animation-duration: 22s; animation-delay: -7s; font-size: 1.8rem; color:#FFB7D5;">🩷</div>
        <div class="bg-heart left-[85%]" style="animation-duration: 17s; animation-delay: -2s; font-size: 2.2rem;">🤍</div>
        <div class="bg-heart left-[95%]" style="animation-duration: 20s; animation-delay: -12s; font-size: 1.5rem; color:#FFB7D5;">✨</div>
    </div>

    <!-- ==================== CUSTOMER VIEW ==================== -->
    <div id="customerView" class="flex-grow flex flex-col w-full max-w-4xl mx-auto bg-white/80 backdrop-blur-md shadow-[0_0_40px_rgba(255,183,213,0.3)] min-h-screen relative z-10 border-x border-white/50">
        
        <header class="sticky top-0 z-40 bg-sugar-300 text-sugar-800 shadow-md border-b-2 border-white/50">
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <h1 id="cv-storeName" class="text-xl font-extrabold tracking-wide flex items-center gap-2 drop-shadow-sm">SUGAR GAMING</h1>
                </div>
                <button onclick="scrollToSection('contact')" class="bg-white text-sugar-600 px-4 py-1.5 rounded-full text-sm font-bold shadow-sm hover:bg-sugar-50 border border-sugar-100 transition">
                    ติดต่อเรา
                </button>
            </div>
        </header>

        <section class="relative bg-gradient-to-b from-sugar-200 via-sugar-100 to-sugar-50 pt-10 pb-8 px-4 text-center overflow-hidden border-b-4 border-white">
            
            <div class="absolute inset-0 z-0 pointer-events-none">
                <div class="hero-cloud top-[10%] text-5xl opacity-80" style="animation-duration: 25s; animation-delay: 0s;">☁️</div>
                <div class="hero-cloud top-[45%] text-6xl opacity-60" style="animation-duration: 35s; animation-delay: -15s;">☁️</div>
                <div class="hero-cloud top-[25%] text-7xl opacity-90" style="animation-duration: 28s; animation-delay: -8s;">☁️</div>
                <div class="hero-cloud top-[60%] text-4xl opacity-70" style="animation-duration: 22s; animation-delay: -5s;">☁️</div>
            </div>

            <div class="flex justify-center mb-5 relative z-10">
                <div class="relative w-36 h-36 sm:w-44 sm:h-44 rounded-full shadow-[0_8px_25px_rgba(255,133,162,0.4)] bg-white border-[6px] border-white z-10 p-1 transform hover:scale-105 transition duration-300">
                    <img id="cv-logoImage" src="" alt="SUGAR GAMING Logo" class="w-full h-full object-cover rounded-full hidden">
                    <span id="cv-logoText" class="text-6xl flex items-center justify-center w-full h-full">🎀</span>
                </div>
            </div>
            
            <h2 id="cv-tagline" class="text-2xl md:text-3xl font-extrabold text-sugar-800 mb-2 z-10 relative drop-shadow-sm">
